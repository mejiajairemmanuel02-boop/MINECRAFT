    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    </header>

    <main class="container">
      <section class="card">
        <h2>¿Qué ofrecemos?</h2>
        <ul>
          <li>Eventos semanales con recompensas.</li>
          <li>Construcción colaborativa por clanes.</li>
          <li>Guías rápidas para jugadores nuevos.</li>
        </ul>
      </section>

      <section class="card">
        <h2>Estado del servidor</h2>
        <p id="server-status">Consultando...</p>
      </section>
    </main>

    <footer>
      <small>© 2026 Ballakos Craft</small>
    </footer>

    <script src="script.js"></script>
